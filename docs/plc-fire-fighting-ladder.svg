<svg width="1200" height="980" viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 28px Arial; fill: #111; }
      .label { font: 16px Arial; fill: #111; }
      .small { font: 13px Arial; fill: #333; }
      .rail { stroke: #222; stroke-width: 4; }
      .wire { stroke: #333; stroke-width: 2; }
      .contact { stroke: #222; stroke-width: 2; fill: none; }
      .coil { stroke: #222; stroke-width: 2; fill: #fff; }
      .line { stroke: #333; stroke-width: 2; fill: none; }
      .tag { font: 14px Arial; fill: #111; }
    </style>
  </defs>

  <text x="480" y="50" class="title">PLC Based Automatic Fire Fighting System</text>
  <text x="70" y="95" class="label">Ladder Logic Diagram</text>

  <!-- Left and right rails -->
  <line x1="80" y1="120" x2="80" y2="900" class="rail"/>
  <line x1="1120" y1="120" x2="1120" y2="900" class="rail"/>

  <!-- Rung 1 -->
  <line x1="80" y1="150" x2="1120" y2="150" class="wire"/>
  <line x1="80" y1="210" x2="1120" y2="210" class="wire"/>

  <text x="110" y="175" class="tag">I0.0</text>
  <text x="235" y="175" class="tag">I0.1</text>
  <text x="360" y="175" class="tag">I0.2</text>
  <text x="485" y="175" class="tag">I0.3</text>
  <text x="610" y="175" class="tag">I0.4</text>

  <!-- Contacts -->
  <line x1="120" y1="130" x2="120" y2="190" class="contact"/>
  <line x1="150" y1="130" x2="150" y2="190" class="contact"/>
  <path d="M120 130 L150 130 L150 190 L120 190" class="contact"/>
  <circle cx="120" cy="160" r="12" class="contact"/>
  <circle cx="150" cy="160" r="12" class="contact"/>

  <line x1="245" y1="130" x2="245" y2="190" class="contact"/>
  <line x1="275" y1="130" x2="275" y2="190" class="contact"/>
  <path d="M245 130 L275 130 L275 190 L245 190" class="contact"/>
  <circle cx="245" cy="160" r="12" class="contact"/>
  <circle cx="275" cy="160" r="12" class="contact"/>

  <line x1="370" y1="130" x2="370" y2="190" class="contact"/>
  <line x1="400" y1="130" x2="400" y2="190" class="contact"/>
  <path d="M370 130 L400 130 L400 190 L370 190" class="contact"/>
  <circle cx="370" cy="160" r="12" class="contact"/>
  <circle cx="400" cy="160" r="12" class="contact"/>

  <line x1="495" y1="130" x2="495" y2="190" class="contact"/>
  <line x1="525" y1="130" x2="525" y2="190" class="contact"/>
  <path d="M495 130 L525 130 L525 190 L495 190" class="contact"/>
  <circle cx="495" cy="160" r="12" class="contact"/>
  <circle cx="525" cy="160" r="12" class="contact"/>

  <line x1="620" y1="130" x2="620" y2="190" class="contact"/>
  <line x1="650" y1="130" x2="650" y2="190" class="contact"/>
  <path d="M620 130 L650 130 L650 190 L620 190" class="contact"/>
  <circle cx="620" cy="160" r="12" class="contact"/>
  <circle cx="650" cy="160" r="12" class="contact"/>

  <text x="760" y="175" class="tag">M0.0</text>
  <circle cx="870" cy="160" r="20" class="coil"/>
  <line x1="850" y1="160" x2="890" y2="160" class="wire"/>
  <line x1="870" y1="140" x2="870" y2="180" class="wire"/>
  <line x1="1040" y1="160" x2="1120" y2="160" class="wire"/>
  <text x="900" y="165" class="label">Fire Detected</text>

  <!-- Rung 2 -->
  <line x1="80" y1="240" x2="1120" y2="240" class="wire"/>
  <line x1="80" y1="300" x2="1120" y2="300" class="wire"/>

  <text x="110" y="265" class="tag">I0.0</text>
  <text x="245" y="265" class="tag">I0.2</text>
  <text x="760" y="265" class="tag">M0.1</text>

  <line x1="120" y1="220" x2="120" y2="280" class="contact"/>
  <line x1="150" y1="220" x2="150" y2="280" class="contact"/>
  <path d="M120 220 L150 220 L150 280 L120 280" class="contact"/>
  <circle cx="120" cy="250" r="12" class="contact"/>
  <circle cx="150" cy="250" r="12" class="contact"/>

  <line x1="245" y1="220" x2="245" y2="280" class="contact"/>
  <line x1="275" y1="220" x2="275" y2="280" class="contact"/>
  <path d="M245 220 L275 220 L275 280 L245 280" class="contact"/>
  <circle cx="245" cy="250" r="12" class="contact"/>
  <circle cx="275" cy="250" r="12" class="contact"/>

  <circle cx="870" cy="250" r="20" class="coil"/>
  <line x1="850" y1="250" x2="890" y2="250" class="wire"/>
  <line x1="870" y1="230" x2="870" y2="270" class="wire"/>
  <text x="900" y="255" class="label">Zone 1 Fire</text>

  <!-- Rung 3 -->
  <line x1="80" y1="330" x2="1120" y2="330" class="wire"/>
  <line x1="80" y1="390" x2="1120" y2="390" class="wire"/>

  <text x="110" y="355" class="tag">I0.1</text>
  <text x="245" y="355" class="tag">I0.3</text>
  <text x="760" y="355" class="tag">M0.2</text>

  <line x1="120" y1="310" x2="120" y2="370" class="contact"/>
  <line x1="150" y1="310" x2="150" y2="370" class="contact"/>
  <path d="M120 310 L150 310 L150 370 L120 370" class="contact"/>
  <circle cx="120" cy="340" r="12" class="contact"/>
  <circle cx="150" cy="340" r="12" class="contact"/>

  <line x1="245" y1="310" x2="245" y2="370" class="contact"/>
  <line x1="275" y1="310" x2="275" y2="370" class="contact"/>
  <path d="M245 310 L275 310 L275 370 L245 370" class="contact"/>
  <circle cx="245" cy="340" r="12" class="contact"/>
  <circle cx="275" cy="340" r="12" class="contact"/>

  <circle cx="870" cy="340" r="20" class="coil"/>
  <line x1="850" y1="340" x2="890" y2="340" class="wire"/>
  <line x1="870" y1="320" x2="870" y2="360" class="wire"/>
  <text x="900" y="345" class="label">Zone 2 Fire</text>

  <!-- Rung 4 -->
  <line x1="80" y1="420" x2="1120" y2="420" class="wire"/>
  <line x1="80" y1="480" x2="1120" y2="480" class="wire"/>

  <text x="110" y="445" class="tag">M0.0</text>
  <text x="260" y="445" class="tag">Q0.0</text>
  <text x="430" y="445" class="tag">Q0.1</text>
  <text x="600" y="445" class="tag">Q0.4</text>
  <text x="770" y="445" class="tag">Q0.5</text>

  <circle cx="170" cy="450" r="20" class="coil"/>
  <line x1="150" y1="450" x2="190" y2="450" class="wire"/>
  <line x1="170" y1="430" x2="170" y2="470" class="wire"/>
  <text x="200" y="455" class="label">Pump ON</text>

  <circle cx="330" cy="450" r="20" class="coil"/>
  <line x1="310" y1="450" x2="350" y2="450" class="wire"/>
  <line x1="330" y1="430" x2="330" y2="470" class="wire"/>
  <text x="360" y="455" class="label">Alarm Bell</text>

  <circle cx="510" cy="450" r="20" class="coil"/>
  <line x1="490" y1="450" x2="530" y2="450" class="wire"/>
  <line x1="510" y1="430" x2="510" y2="470" class="wire"/>
  <text x="540" y="455" class="label">Beacon</text>

  <circle cx="690" cy="450" r="20" class="coil"/>
  <line x1="670" y1="450" x2="710" y2="450" class="wire"/>
  <line x1="690" y1="430" x2="690" y2="470" class="wire"/>
  <text x="720" y="455" class="label">Emergency Light</text>

  <!-- Rung 5 -->
  <line x1="80" y1="510" x2="1120" y2="510" class="wire"/>
  <line x1="80" y1="570" x2="1120" y2="570" class="wire"/>

  <text x="110" y="535" class="tag">M0.1</text>
  <text x="760" y="535" class="tag">Q0.2</text>

  <circle cx="870" cy="540" r="20" class="coil"/>
  <line x1="850" y1="540" x2="890" y2="540" class="wire"/>
  <line x1="870" y1="520" x2="870" y2="560" class="wire"/>
  <text x="900" y="545" class="label">Zone 1 Sprinkler Valve</text>

  <!-- Rung 6 -->
  <line x1="80" y1="600" x2="1120" y2="600" class="wire"/>
  <line x1="80" y1="660" x2="1120" y2="660" class="wire"/>

  <text x="110" y="625" class="tag">M0.2</text>
  <text x="760" y="625" class="tag">Q0.3</text>

  <circle cx="870" cy="630" r="20" class="coil"/>
  <line x1="850" y1="630" x2="890" y2="630" class="wire"/>
  <line x1="870" y1="610" x2="870" y2="650" class="wire"/>
  <text x="900" y="635" class="label">Zone 2 Sprinkler Valve</text>

  <!-- Rung 7 -->
  <line x1="80" y1="690" x2="1120" y2="690" class="wire"/>
  <line x1="80" y1="750" x2="1120" y2="750" class="wire"/>

  <text x="110" y="715" class="tag">I0.5</text>
  <text x="250" y="715" class="tag">/M0.0</text>
  <text x="760" y="715" class="tag">M0.3</text>

  <line x1="120" y1="670" x2="120" y2="730" class="contact"/>
  <line x1="150" y1="670" x2="150" y2="730" class="contact"/>
  <path d="M120 670 L150 670 L150 730 L120 730" class="contact"/>
  <circle cx="120" cy="700" r="12" class="contact"/>
  <circle cx="150" cy="700" r="12" class="contact"/>

  <line x1="250" y1="670" x2="250" y2="730" class="contact"/>
  <line x1="280" y1="670" x2="280" y2="730" class="contact"/>
  <path d="M250 670 L280 670 L280 730 L250 730" class="contact"/>
  <circle cx="250" cy="700" r="12" class="contact"/>
  <circle cx="280" cy="700" r="12" class="contact"/>
  <line x1="270" y1="690" x2="260" y2="710" class="wire"/>

  <circle cx="870" cy="700" r="20" class="coil"/>
  <line x1="850" y1="700" x2="890" y2="700" class="wire"/>
  <line x1="870" y1="680" x2="870" y2="720" class="wire"/>
  <text x="900" y="705" class="label">Reset Signal</text>

  <!-- Rung 8 -->
  <line x1="80" y1="780" x2="1120" y2="780" class="wire"/>
  <line x1="80" y1="840" x2="1120" y2="840" class="wire"/>

  <text x="110" y="805" class="tag">M0.3</text>
  <text x="760" y="805" class="tag">Reset</text>

  <circle cx="870" cy="810" r="20" class="coil"/>
  <line x1="850" y1="810" x2="890" y2="810" class="wire"/>
  <line x1="870" y1="790" x2="870" y2="830" class="wire"/>
  <text x="900" y="815" class="label">All Outputs OFF</text>

  <text x="90" y="900" class="small">Note: This is a conceptual PLC ladder logic representation for fire detection and suppression control.</text>
</svg>
